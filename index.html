<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة زفاف زينب وخالد</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Reem+Kufi:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: 
                radial-gradient(circle, rgba(61,48,43,0.95) 0%, rgba(28,21,18,0.98) 100%),
                url('https://images.unsplash.com/photo-1541781774459-bb2af2f05b55?q=80&w=1000&auto=format&fit=crop') center/cover no-repeat;
            color: #f4ebd0;
            font-family: 'Amiri', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-y: auto;
            padding: 15px 10px;
        }

        .music-toggle {
            position: fixed;
            top: 15px;
            left: 15px;
            background: rgba(45, 35, 31, 0.9);
            border: 1px solid #c5a059;
            color: #e6c587;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            z-index: 100;
            display: none;
            font-family: 'Reem Kufi', sans-serif;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* شاشة الظرف */
        .envelope-container {
            text-align: center;
            cursor: pointer;
            width: 90%;
            max-width: 320px;
        }
        .envelope {
            width: 100%;
            height: 160px;
            background: linear-gradient(135deg, #3d302b 0%, #1c1512 100%);
            border: 2px solid #c5a059;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 15px;
            position: relative;
        }
        .envelope::after {
            content: '';
            position: absolute;
            inset: 5px;
            border: 1px dashed rgba(197, 160, 89, 0.4);
            border-radius: 8px;
        }
        .envelope-text {
            font-family: 'Reem Kufi', sans-serif;
            color: #e6c587;
            font-size: 1.1rem;
            z-index: 1;
        }

        /* اختيار اللغات */
        .language-selection {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            text-align: center;
            width: 90%;
            max-width: 320px;
            animation: fadeIn 0.6s ease-in-out forwards;
        }
        .lang-title {
            font-family: 'Reem Kufi', sans-serif;
            color: #e6c587;
            font-size: 1.2rem;
            margin-bottom: 5px;
        }
        .lang-btn {
            width: 100%;
            background: linear-gradient(135deg, #3d302b 0%, #1c1512 100%);
            border: 1.5px solid #c5a059;
            color: #e6c587;
            padding: 12px;
            border-radius: 10px;
            font-family: 'Reem Kufi', sans-serif;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            transition: 0.3s;
        }
        .lang-btn:hover {
            background: #c5a059;
            color: #1c1512;
        }

        /* محتوى الدعوة والسلايدر */
        .invitation-content {
            display: none;
            width: 100%;
            max-width: 380px;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            animation: fadeIn 0.6s ease-in-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* إطار التصويرة الموحد (Fixed Frame) باش يبقاو كاملين بنفس الحجم */
        .card-image-box {
            width: 100%;
            height: 500px; /* تحديد طول ثابت للإطار باش مايبقاش يتغير */
            border: 2px solid #c5a059;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            background: #1c1512;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        .card-image-box img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* كتخلي التصويرة تبان كاملة ومقادة وسط الإطار بلا تقطيع */
            display: block;
        }

        /* أزرار التنقل بين التصاور */
        .slider-nav {
            display: flex;
            justify-content: space-between;
            width: 100%;
            gap: 10px;
        }
        .nav-btn {
            flex: 1;
            background: rgba(61,48,43,0.9);
            border: 1px solid #c5a059;
            color: #e6c587;
            padding: 8px;
            border-radius: 8px;
            font-family: 'Reem Kufi', sans-serif;
            cursor: pointer;
            font-size: 0.9rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            transition: 0.2s;
        }
        .nav-btn:hover {
            background: #c5a059;
            color: #1c1512;
        }

        /* العد التنازلي */
        .countdown-card {
            width: 100%;
            background: linear-gradient(145deg, rgba(61,48,43,0.95) 0%, rgba(28,21,18,0.98) 100%);
            border: 1.5px solid #c5a059;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.7);
        }
        .countdown-title {
            font-family: 'Reem Kufi', sans-serif;
            font-size: 0.9rem;
            color: #e6c587;
            margin-bottom: 8px;
        }
        .countdown-box {
            display: flex;
            justify-content: center;
            gap: 8px;
        }
        .time-block {
            background: rgba(197, 160, 89, 0.1);
            border: 1px solid rgba(197, 160, 89, 0.3);
            border-radius: 6px;
            padding: 6px 10px;
            text-align: center;
            min-width: 50px;
        }
        .time-num { font-size: 1rem; color: #e6c587; font-weight: bold; font-family: 'Reem Kufi', sans-serif; }
        .time-label { font-size: 0.65rem; color: #b8975b; }
    </style>
</head>
<body id="bodyTag">

    <audio id="bgMusic" loop>
        <source src="music.mp3" type="audio/mp3">
    </audio>

    <button class="music-toggle" id="musicToggleBtn" onclick="toggleMusic()">🔊 الموسيقى</button>

    <!-- شاشة الظرف -->
    <div class="envelope-container" id="envelopeContainer" onclick="openEnvelope()">
        <div class="envelope">
            <div class="envelope-text">اضغط لفتح الدعوة ✉</div>
        </div>
    </div>

    <!-- اختيار اللغة -->
    <div class="language-selection" id="languageSelection">
        <div class="lang-title">المرجو اختيار لغة الدعوة</div>
        <button class="lang-btn" onclick="selectLanguage('ar')">العربية 🇲🇦</button>
        <button class="lang-btn" onclick="selectLanguage('fr')">Français 🇫🇷</button>
        <button class="lang-btn" onclick="selectLanguage('en')">English 🇬🇧</button>
    </div>

    <!-- محتوى الدعوة -->
    <div class="invitation-content" id="invitationContent">
        <div class="card-image-box">
            <img id="invitationImage" src="" alt="دعوة زفاف">
        </div>

        <div class="slider-nav">
            <button class="nav-btn" id="prevBtn" onclick="changeSlide(-1)">السابق</button>
            <button class="nav-btn" id="nextBtn" onclick="changeSlide(1)">التالي</button>
        </div>

        <div class="countdown-card">
            <div class="countdown-title" id="countdownTitle">العد التنازلي لليلة العمر ❤️</div>
            <div class="countdown-box">
                <div class="time-block"><div class="time-num" id="days">00</div><div class="time-label" id="labelDays">يوم</div></div>
                <div class="time-block"><div class="time-num" id="hours">00</div><div class="time-label" id="labelHours">ساعة</div></div>
                <div class="time-block"><div class="time-num" id="mins">00</div><div class="time-label" id="labelMins">دقيقة</div></div>
            </div>
        </div>
    </div>

    <script>
        let currentLang = 'ar';
        let currentIndex = 0;
        
        const images = {
            ar: ['ZAINAB/AR/ar-1.jpeg', 'ZAINAB/AR/ar-2.jpeg', 'ZAINAB/AR/ar-3.jpeg'],
            fr: ['ZAINAB/FR/fr-1.jpeg', 'ZAINAB/FR/fr-2.jpeg', 'ZAINAB/FR/fr-3.jpeg'],
            en: ['ZAINAB/ENG/eng-1.jpeg', 'ZAINAB/ENG/eng-2.jpeg', 'ZAINAB/ENG/eng-3.jpeg']
        };

        const texts = {
            ar: {
                prev: '▶ السابق',
                next: 'التالي ◀',
                countdown: 'العد التنازلي لليلة العمر ❤️',
                days: 'يوم',
                hours: 'ساعة',
                mins: 'دقيقة'
            },
            fr: {
                prev: '▶ Précédent',
                next: 'Suivant ◀',
                countdown: 'Compte à rebours du grand jour ❤️',
                days: 'Jours',
                hours: 'Heures',
                mins: 'Minutes'
            },
            en: {
                prev: '▶ Previous',
                next: 'Next ◀',
                countdown: 'Countdown to the big day ❤️',
                days: 'Days',
                hours: 'Hours',
                mins: 'Mins'
            }
        };

        function openEnvelope() {
            const music = document.getElementById('bgMusic');
            music.play().catch(error => console.log("Audio play blocked", error));
            
            document.getElementById('envelopeContainer').style.display = 'none';
            document.getElementById('languageSelection').style.display = 'flex';
            document.getElementById('musicToggleBtn').style.display = 'block';
        }

        function selectLanguage(lang) {
            currentLang = lang;
            currentIndex = 0;
            
            const bodyTag = document.getElementById('bodyTag');
            if (lang === 'ar') {
                bodyTag.dir = 'rtl';
                bodyTag.style.textAlign = 'right';
            } else {
                bodyTag.dir = 'ltr';
                bodyTag.style.textAlign = 'left';
            }

            document.getElementById('prevBtn').innerText = texts[lang].prev;
            document.getElementById('nextBtn').innerText = texts[lang].next;
            document.getElementById('countdownTitle').innerText = texts[lang].countdown;
            document.getElementById('labelDays').innerText = texts[lang].days;
            document.getElementById('labelHours').innerText = texts[lang].hours;
            document.getElementById('labelMins').innerText = texts[lang].mins;

            document.getElementById('languageSelection').style.display = 'none';
            document.getElementById('invitationContent').style.display = 'flex';
            updateImage();
        }

        function changeSlide(direction) {
            currentIndex += direction;
            if (currentIndex < 0) {
                currentIndex = images[currentLang].length - 1;
            } else if (currentIndex >= images[currentLang].length) {
                currentIndex = 0;
            }
            updateImage();
        }

        function updateImage() {
            document.getElementById('invitationImage').src = images[currentLang][currentIndex];
        }

        // العد التنازلي
        const targetDate = new Date("November 13, 2026 00:00:00").getTime();
        setInterval(() => {
            const now = new Date().getTime();
            const diff = targetDate - now;
            if (diff > 0) {
                document.getElementById("days").innerText = Math.floor(diff / (1000 * 60 * 60 * 24));
                document.getElementById("hours").innerText = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                document.getElementById("mins").innerText = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            }
        }, 1000);

        function toggleMusic() {
            const music = document.getElementById('bgMusic');
            const btn = document.getElementById('musicToggleBtn');
            if (music.paused) {
                music.play();
                btn.innerText = currentLang === 'ar' ? "🔊 الموسيقى" : (currentLang === 'fr' ? "🔊 Musique" : "🔊 Music");
            } else {
                music.pause();
                btn.innerText = currentLang === 'ar' ? "🔇 صامت" : (currentLang === 'fr' ? "🔇 Muet" : "🔇 Muted");
            }
        }
    </script>
</body>
</html>
