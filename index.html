<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة زفاف زينب وخالد</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Reem+Kufi:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: 
                radial-gradient(circle, rgba(61,48,43,0.95) 0%, rgba(28,21,18,0.98) 100%),
                url('https://images.unsplash.com/photo-1541781774459-bb2af2f05b55?q=80&w=1000&auto=format&fit=crop') center/cover no-repeat;
            color: #f4ebd0;
            font-family: 'Amiri', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-y: auto;
            padding: 15px 10px;
            direction: rtl;
            text-align: right;
        }

        .music-toggle {
            position: fixed;
            top: 15px;
            left: 15px;
            background: rgba(45, 35, 31, 0.9);
            border: 1px solid #c5a059;
            color: #e6c587;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            z-index: 100;
            display: none;
            font-family: 'Reem Kufi', sans-serif;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .envelope-container {
            text-align: center;
            cursor: pointer;
            width: 90%;
            max-width: 320px;
        }
        .envelope {
            width: 100%;
            height: 160px;
            background: linear-gradient(135deg, #3d302b 0%, #1c1512 100%);
            border: 2px solid #c5a059;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 15px;
            position: relative;
        }
        .envelope::after {
            content: '';
            position: absolute;
            inset: 5px;
            border: 1px dashed rgba(197, 160, 89, 0.4);
            border-radius: 8px;
        }
        .envelope-text {
            font-family: 'Reem Kufi', sans-serif;
            color: #e6c587;
            font-size: 1.1rem;
            z-index: 1;
        }

        .invitation-content {
            display: none;
            width: 100%;
            max-width: 380px;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            animation: fadeIn 0.6s ease-in-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .card-image-box {
            width: 100%;
            border: 2px solid #c5a059;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            background: #1c1512;
        }
        .card-image-box img {
            width: 100%;
            height: auto;
            display: block;
        }

        .countdown-card {
            width: 100%;
            background: linear-gradient(145deg, rgba(61,48,43,0.95) 0%, rgba(28,21,18,0.98) 100%);
            border: 1.5px solid #c5a059;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.7);
        }
        .countdown-title {
            font-family: 'Reem Kufi', sans-serif;
            font-size: 1rem;
            color: #e6c587;
            margin-bottom: 10px;
        }
        .countdown-box {
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        .time-block {
            background: rgba(197, 160, 89, 0.1);
            border: 1px solid rgba(197, 160, 89, 0.3);
            border-radius: 6px;
            padding: 8px 12px;
            text-align: center;
            min-width: 60px;
        }
        .time-num { font-size: 1.1rem; color: #e6c587; font-weight: bold; font-family: 'Reem Kufi', sans-serif; }
        .time-label { font-size: 0.7rem; color: #b8975b; }
    </style>
</head>
<body>

    <!-- ملف الموسيقى (تأكد أن اسم الملف هنا يطابق اسم ملف الـ mp3 الذي رفعته) -->
    <audio id="bgMusic" loop>
        <source src="wedding.mp3" type="audio/mp3">
    </audio>

    <button class="music-toggle" id="musicToggleBtn" onclick="toggleMusic()">🔊 الموسيقى</button>

    <div class="envelope-container" id="envelopeContainer" onclick="startInvitation()">
        <div class="envelope">
            <div class="envelope-text">اضغط لفتح الدعوة ✉</div>
        </div>
    </div>

    <div class="invitation-content" id="invitationContent">
        <div class="card-image-box">
            <img src="wedding.jpg" alt="دعوة زفاف زينب وخالد">
        </div>

        <div class="countdown-card">
            <div class="countdown-title">العد التنازلي لليلة العمر ❤️</div>
            <div class="countdown-box">
                <div class="time-block"><div class="time-num" id="days">00</div><div class="time-label">يوم</div></div>
                <div class="time-block"><div class="time-num" id="hours">00</div><div class="time-label">ساعة</div></div>
                <div class="time-block"><div class="time-num" id="mins">00</div><div class="time-label">دقيقة</div></div>
            </div>
        </div>
    </div>

    <script>
        const targetDate = new Date("November 13, 2026 00:00:00").getTime();
        setInterval(() => {
            const now = new Date().getTime();
            const diff = targetDate - now;
            if (diff > 0) {
                document.getElementById("days").innerText = Math.floor(diff / (1000 * 60 * 60 * 24));
                document.getElementById("hours").innerText = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                document.getElementById("mins").innerText = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            }
        }, 1000);

        function startInvitation() {
            const music = document.getElementById('bgMusic');
            music.play().catch(error => console.log("Audio play blocked", error));
            
            document.getElementById('envelopeContainer').style.display = 'none';
            document.getElementById('invitationContent').style.display = 'flex';
            document.getElementById('musicToggleBtn').style.display = 'block';
        }

        function toggleMusic() {
            const music = document.getElementById('bgMusic');
            const btn = document.getElementById('musicToggleBtn');
            if (music.paused) {
                music.play();
                btn.innerText = "🔊 الموسيقى";
            } else {
                music.pause();
                btn.innerText = "🔇 صامت";
            }
        }
    </script>
</body>
</html>
